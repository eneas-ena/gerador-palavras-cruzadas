<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cruzadas da Escritura</title>
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cruzadas">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1B33'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='38' fill='%23C9A227' text-anchor='middle'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F1B33; --navy2:#16264A; --gold:#C9A227; --gold-cl:#E7C65A;
  --creme:#F5EFE0; --papel:#FFFDF7; --tinta:#1A1A18; --linha:#8D8B84;
  --erro:#B3453A; --ok:#2E7D5B;
  --cel:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--navy); color:var(--creme);
  font-family:'Cormorant Garamond',Georgia,serif; font-size:18px; line-height:1.5;
  overscroll-behavior-y:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
.envelope{max-width:1040px;margin:0 auto;padding:18px 16px 24px}

/* ---------- cabeçalho ---------- */
.topo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topo h1{font-family:'Cinzel',serif;font-weight:600;font-size:26px;margin:0;color:var(--gold-cl);letter-spacing:.04em}
.topo p{margin:0;color:rgba(245,239,224,.6);font-size:16px}

/* ---------- botões ---------- */
.bt{border:1px solid rgba(201,162,39,.45);border-radius:6px;padding:9px 16px;background:rgba(201,162,39,.08);
  transition:background .15s,border-color .15s}
.bt:hover{background:rgba(201,162,39,.18)}
.bt:focus-visible{outline:2px solid var(--gold-cl);outline-offset:2px}
.bt.forte{background:var(--gold);color:#1B1403;border-color:var(--gold);font-weight:600}
.bt.forte:hover{background:var(--gold-cl)}
.bt.mudo{border-color:rgba(245,239,224,.2);background:none;color:rgba(245,239,224,.75)}

/* ---------- seleção de nível ---------- */
.niveis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:26px}
.nivel{border:1px solid rgba(201,162,39,.3);border-radius:10px;padding:16px 18px;text-align:left;
  display:flex;flex-direction:column;gap:4px}
.nivel[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,162,39,.12)}
.nivel b{font-family:'Cinzel',serif;font-size:18px;color:var(--gold-cl);font-weight:600}
.nivel span{color:rgba(245,239,224,.6);font-size:16px}

.paginas{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.pag{border:1px solid rgba(245,239,224,.18);border-radius:8px;padding:12px 8px;text-align:center;line-height:1.25}
.pag:hover{border-color:var(--gold)}
.pag b{display:block;font-family:'Cinzel',serif;font-size:20px;color:var(--creme)}
.pag small{color:rgba(245,239,224,.5);font-size:14px}
.pag.feita{border-color:rgba(46,125,91,.7)}
.pag.feita small{color:#7FC3A4}

/* ---------- folha do quebra-cabeça ---------- */
.folha{background:var(--papel);color:var(--tinta);border-radius:8px;padding:16px;
  display:block;max-width:100%;overflow:auto}
.cabFolha{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:10px;
  font-family:'Cinzel',serif;font-size:14px;color:#4A4842;letter-spacing:.04em}
.grade{display:grid;gap:0;border:1.6px solid var(--tinta);width:max-content;max-width:100%;margin:0 auto}
.cel{width:var(--cel);height:var(--cel);border:.5px solid var(--linha);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.cel.bloco{background:#DCD8CC}
.cel.dica{background:#EDE9DC;cursor:default;padding:2px 3px;display:block}
.cel.letra{background:#fff;cursor:pointer;font-family:'Cinzel',serif;font-weight:600;
  font-size:calc(var(--cel) * .48);color:var(--tinta);user-select:none}
.cel.letra.dado{color:#6C6A63}
.cel.letra.ativa{background:#FBF0C8}
.cel.letra.foco{background:#F5DE86;box-shadow:inset 0 0 0 2px #A9821A}
.cel.letra.errada{color:var(--erro)}
.def{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:10px;line-height:1.1;
  color:#2C2B27;height:50%;display:flex;align-items:center;padding-right:7px;overflow:hidden}
.def.só{height:100%}
.def.curta{font-size:11px}
.def.longa{font-size:9px}
.cel.dica.duas .def:first-child{border-bottom:.5px solid var(--linha)}
.seta{position:absolute;color:#8A6C12;font-size:11px;line-height:1}
.seta.h{right:1px}
.seta.v{bottom:0}

/* ---------- barra de dica (compacto) ---------- */
.barra{display:none}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.relogio{font-family:'Cinzel',serif;color:var(--gold-cl);margin-left:auto;font-size:18px}

/* ---------- teclado ---------- */
.teclado{display:none;position:sticky;bottom:0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  background:var(--navy2);border-top:1px solid rgba(201,162,39,.25);margin:16px -16px -24px}
.linhaT{display:flex;gap:4px;justify-content:center;margin-bottom:4px}
.tecla{flex:1 1 0;max-width:38px;height:44px;border-radius:5px;background:rgba(245,239,224,.1);
  font-family:'Cinzel',serif;font-size:16px;display:flex;align-items:center;justify-content:center}
.tecla:active{background:var(--gold);color:#1B1403}
.tecla.larga{max-width:80px;font-size:14px;font-family:'Cormorant Garamond',serif}

/* ---------- modal ---------- */
.veu{position:fixed;inset:0;background:rgba(8,14,28,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.veu.aberto{display:flex}
.caixa{background:var(--navy2);border:1px solid rgba(201,162,39,.4);border-radius:12px;padding:24px;max-width:420px;width:100%}
.caixa h2{font-family:'Cinzel',serif;color:var(--gold-cl);margin:0 0 8px;font-size:22px;font-weight:600}
.caixa ul{margin:12px 0 0;padding-left:20px;color:rgba(245,239,224,.8)}

.oculto{display:none !important}
.soImpressao{display:none}

/* ---------- modo compacto: celular ---------- */
@media (max-width:760px){
  body{font-size:17px}
  .envelope{padding:14px 16px 0}
  .folha{padding:10px}
  .def{display:none}
  .cel.dica{background:#E4DFCE}
  .seta{font-size:13px;top:50%;transform:translateY(-50%)}
  .seta.v{top:auto;bottom:1px;left:50%;transform:translateX(-50%)}
  .barra{display:flex;position:sticky;bottom:0;z-index:5;gap:10px;align-items:center;
    background:var(--navy2);border-top:1px solid rgba(201,162,39,.25);
    margin:12px -16px 0;padding:10px 14px;min-height:56px}
  .barra .txt{flex:1;font-size:17px;line-height:1.25}
  .barra .nav{border:1px solid rgba(245,239,224,.25);border-radius:5px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center}
  .teclado{display:block}
  .relogio{margin-left:auto}
}

/* ---------- impressão ---------- */
@media print{
  :root{--cel:14mm}
  .folha{--cel:14mm !important}
  body{background:#fff;color:#000}
  .envelope{max-width:none;padding:0}
  .topo,.acoes,.teclado,.barra,.niveis,.paginas,.veu,.naoImprime{display:none !important}
  .folha{border:0;padding:0;background:#fff;display:block;page-break-after:always}
  .folha:last-child{page-break-after:auto}
  .def{display:flex;font-size:9px}
  .def.longa{font-size:8px}
  .cel.dica{background:#EFEFEF}
  .cel.bloco{background:#CFCFCF}
  .cel.letra.ativa,.cel.letra.foco{background:#fff;box-shadow:none}
  .gabarito{display:block !important}
  .soImpressao{display:inline;font-weight:400;letter-spacing:0}
  .cabFolha{font-size:12px}
}
.gabarito{display:none}
</style>
</head>

<div class="envelope">

    <div class="teclado naoImprime" id="teclado"></div>
  </section>
</div>

<div class="veu" id="veu">
  <div class="caixa">
    <h2 id="tituloModal"></h2>
    <div id="corpoModal"></div>
    <div class="acoes"><button class="bt forte" id="btFecharModal">Fechar</button></div>
  </div>
</div>

const VERSAO = '2.0';
document.getElementById('versao').textContent = VERSAO;

const NIVEIS = [
  { id: 1, nome: 'Iniciante', desc: 'Palavras conhecidas e algumas letras já dadas' },
  { id: 2, nome: 'Intermediário', desc: 'Grade cheia, sem nenhuma ajuda' },
  { id: 3, nome: 'Avançado', desc: 'Grade maior e vocabulário menos comum' },
];
const PAGINAS_POR_NIVEL = Math.max(...PAGINAS.map(p => p.n));

function rng(semente) {
  let a = semente >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- armazenamento tolerante a falha ----------
const cofre = {
  ler(ch) { try { return JSON.parse(localStorage.getItem(ch) || 'null'); } catch (e) { return null; } },
  gravar(ch, v) { try { localStorage.setItem(ch, JSON.stringify(v)); } catch (e) { } },
  apagar(pref) { try { Object.keys(localStorage).filter(k => k.startsWith(pref)).forEach(k => localStorage.removeItem(k)); } catch (e) { } },
};
const chave = (nv, n) => `cruzada.v2.${nv}.${n}`;

// ---------- a página vem pronta; aqui ela só é remontada em grade ----------
function montar(nv, n) {
  const pg = PAGINAS.find(p => p.nv === nv && p.n === n);
  if (!pg) return null;
  const g = [];
  for (let r = 0; r < pg.h; r++) {
    g.push([]);
    for (let c = 0; c < pg.w; c++) g[r].push({ t: '.', ch: '', H: -1, V: -1 });
  }
  const vagas = pg.vagas.map(v => ({
    dir: v.d, r: v.r, c: v.c, len: v.p.length, dr: v.dr, dc: v.dc,
    pal: { p: v.p, e: v.e, d: v.x, t: v.t, n: v.n },
  }));
  vagas.forEach((v, i) => {
    const cd = g[v.dr][v.dc];
    cd.t = 'D'; cd[v.dir] = i;
    for (let k = 0; k < v.len; k++) {
      const rr = v.dir === 'H' ? v.r : v.r + k;
      const cc = v.dir === 'H' ? v.c + k : v.c;
      g[rr][cc].t = 'L'; g[rr][cc].ch = v.pal.p[k]; g[rr][cc][v.dir] = i;
    }
  });
  return { w: pg.w, h: pg.h, g, vagas, semente: pg.semente, dadas: pg.dadas || 0 };
}

// ---------- estado ----------
let est = null;

function iniciar(nv, n) {
  const pag = montar(nv, n);
  if (!pag) return;
  const salvo = cofre.ler(chave(nv, n));
  const letras = {}, dados = {};
  if (salvo && salvo.letras) Object.assign(letras, salvo.letras);
  else if (pag.dadas > 0) {
    const r = rng(pag.semente + 7);
    for (let i = 0; i < pag.h; i++) for (let c = 0; c < pag.w; c++)
      if (pag.g[i][c].t === 'L' && r() < pag.dadas) { letras[i + ',' + c] = pag.g[i][c].ch; dados[i + ',' + c] = 1; }
  }
  est = {
    nv, n, pag, letras, dados: (salvo && salvo.dados) || dados,
    foco: null, dir: 'H', inicio: Date.now(),
    decorrido: (salvo && salvo.tempo) || 0, feito: !!(salvo && salvo.feito),
  };
  document.getElementById('telaInicio').classList.add('oculto');
  document.getElementById('telaJogo').classList.remove('oculto');
  const rotulo = `${NIVEIS[nv - 1].nome} — página ${n}`;
  document.getElementById('tituloFolha').textContent = rotulo;
  document.getElementById('tituloGab').textContent = rotulo;
  document.getElementById('idFolha').textContent =
    `nº ${nv}-${String(n).padStart(2, '0')} · v${VERSAO} · ${pag.vagas.length} palavras`;
  desenhar();
  desenharGabarito();
  primeiraVaga();
}

// ---------- desenho ----------
function classeDef(txt) { return txt.length <= 14 ? 'curta' : (txt.length > 26 ? 'longa' : ''); }

function celulaDica(cel) {
  const d = document.createElement('div');
  const defs = [];
  if (cel.H >= 0) defs.push(['h', est.pag.vagas[cel.H]]);
  if (cel.V >= 0) defs.push(['v', est.pag.vagas[cel.V]]);
  d.className = 'cel dica' + (defs.length === 2 ? ' duas' : '');
  defs.forEach(([dir, vaga]) => {
    const s = document.createElement('div');
    s.className = 'def ' + classeDef(vaga.pal.d) + (defs.length === 1 ? ' só' : '');
    s.textContent = vaga.pal.d;
    d.appendChild(s);
    const seta = document.createElement('span');
    seta.className = 'seta ' + dir;
    seta.textContent = dir === 'h' ? '▸' : '▾';
    if (defs.length === 2) { seta.style[dir === 'h' ? 'top' : 'bottom'] = dir === 'h' ? '4px' : '2px'; }
    else { seta.style[dir === 'h' ? 'top' : 'bottom'] = dir === 'h' ? '50%' : '2px'; if (dir === 'h') seta.style.transform = 'translateY(-50%)'; }
    if (dir === 'v') { seta.style.left = '50%'; seta.style.transform = 'translateX(-50%)'; }
    d.appendChild(seta);
  });
  return d;
}

// a casa se ajusta à largura disponível: a grade sempre ocupa a folha inteira
function ajustarEscala() {
  if (!est) return;
  const env = document.querySelector('.envelope');
  const compacto = (window.innerWidth || 800) <= 760;
  const folga = (compacto ? 20 : 32) + 32 + 6;   // padding da folha + do envelope + borda
  const disp = env.clientWidth - folga;
  const cel = Math.max(22, Math.min(58, Math.floor(disp / est.pag.w)));
  [document.getElementById('folha'), document.getElementById('folhaGabarito')]
    .forEach(f => f.style.setProperty('--cel', cel + 'px'));
}

function ajustarDicas(raiz) {
  raiz.querySelectorAll('.def').forEach(d => {
    d.style.fontSize = '';
    if (!d.clientHeight) return;
    let t = parseFloat(getComputedStyle(d).fontSize), guarda = 0;
    while (d.scrollHeight > d.clientHeight + 1 && t > 5.5 && guarda++ < 24) { t -= .4; d.style.fontSize = t + 'px'; }
  });
}

function desenhar() {
  const gr = document.getElementById('grade');
  gr.innerHTML = '';
  gr.style.gridTemplateColumns = `repeat(${est.pag.w}, var(--cel))`;
  for (let r = 0; r < est.pag.h; r++) for (let c = 0; c < est.pag.w; c++) {
    const cel = est.pag.g[r][c];
    let d;
    if (cel.t === 'D') d = celulaDica(cel);
    else if (cel.t === 'L') {
      d = document.createElement('div');
      d.className = 'cel letra' + (est.dados[r + ',' + c] ? ' dado' : '');
      d.textContent = est.letras[r + ',' + c] || '';
      d.dataset.r = r; d.dataset.c = c;
      d.addEventListener('click', () => focar(r, c, true));
    } else { d = document.createElement('div'); d.className = 'cel bloco'; }
    gr.appendChild(d);
  }
  ajustarEscala();
  ajustarDicas(gr);
  pintarFoco();
}

function desenharGabarito() {
  const gr = document.getElementById('gradeGabarito');
  gr.innerHTML = '';
  gr.style.gridTemplateColumns = `repeat(${est.pag.w}, var(--cel))`;
  for (let r = 0; r < est.pag.h; r++) for (let c = 0; c < est.pag.w; c++) {
    const cel = est.pag.g[r][c];
    let d;
    if (cel.t === 'D') d = celulaDica(cel);
    else if (cel.t === 'L') { d = document.createElement('div'); d.className = 'cel letra dado'; d.textContent = cel.ch; }
    else { d = document.createElement('div'); d.className = 'cel bloco'; }
    gr.appendChild(d);
  }
  ajustarEscala();
  ajustarDicas(gr);
}

// ---------- foco e navegação ----------
function vagaAtiva() {
  if (!est.foco) return null;
  const cel = est.pag.g[est.foco.r][est.foco.c];
  const i = cel[est.dir];
  return i >= 0 ? est.pag.vagas[i] : (cel.H >= 0 ? est.pag.vagas[cel.H] : (cel.V >= 0 ? est.pag.vagas[cel.V] : null));
}
function celulasDa(v) {
  return Array.from({ length: v.len }, (_, k) => v.dir === 'H' ? [v.r, v.c + k] : [v.r + k, v.c]);
}
function focar(r, c, clique) {
  const cel = est.pag.g[r][c];
  if (cel.t !== 'L') return;
  if (clique && est.foco && est.foco.r === r && est.foco.c === c && cel.H >= 0 && cel.V >= 0)
    est.dir = est.dir === 'H' ? 'V' : 'H';
  else if (cel[est.dir] < 0) est.dir = est.dir === 'H' ? 'V' : 'H';
  est.foco = { r, c };
  pintarFoco();
}
function primeiraVaga() {
  const v = est.pag.vagas[0];
  est.dir = v.dir; focar(v.r, v.c);
}
function irVaga(passo) {
  const atual = vagaAtiva();
  const i = atual ? est.pag.vagas.indexOf(atual) : 0;
  const j = (i + passo + est.pag.vagas.length) % est.pag.vagas.length;
  const v = est.pag.vagas[j];
  est.dir = v.dir; est.foco = { r: v.r, c: v.c }; pintarFoco();
}
function pintarFoco() {
  document.querySelectorAll('#grade .cel.letra').forEach(d => d.classList.remove('ativa', 'foco'));
  const v = vagaAtiva();
  if (v) {
    est.dir = v.dir;
    celulasDa(v).forEach(([r, c]) => {
      const d = document.querySelector(`#grade .cel[data-r="${r}"][data-c="${c}"]`);
      if (d) d.classList.add('ativa');
    });
    document.getElementById('dicaAtiva').textContent = (v.dir === 'H' ? '▸ ' : '▾ ') + v.pal.d + ` (${v.len})`;
  }
  if (est.foco) {
    const d = document.querySelector(`#grade .cel[data-r="${est.foco.r}"][data-c="${est.foco.c}"]`);
    if (d) d.classList.add('foco');
  }
}

// ---------- digitação ----------
function escrever(letra) {
  if (!est.foco) return;
  const k = est.foco.r + ',' + est.foco.c;
  if (est.dados[k]) { avancar(1); return; }
  est.letras[k] = letra;
  const d = document.querySelector(`#grade .cel[data-r="${est.foco.r}"][data-c="${est.foco.c}"]`);
  if (d) { d.textContent = letra; d.classList.remove('errada'); }
  salvar();
  if (!conferirFim()) avancar(1);
}
function apagar() {
  if (!est.foco) return;
  const k = est.foco.r + ',' + est.foco.c;
  if (est.letras[k] && !est.dados[k]) {
    delete est.letras[k];
    const d = document.querySelector(`#grade .cel[data-r="${est.foco.r}"][data-c="${est.foco.c}"]`);
    if (d) { d.textContent = ''; d.classList.remove('errada'); }
  } else avancar(-1);
  salvar();
}
function avancar(passo) {
  const v = vagaAtiva(); if (!v) return;
  const cels = celulasDa(v);
  const i = cels.findIndex(([r, c]) => r === est.foco.r && c === est.foco.c);
  const j = i + passo;
  if (j >= 0 && j < cels.length) { est.foco = { r: cels[j][0], c: cels[j][1] }; pintarFoco(); }
  else if (passo > 0) irVaga(1);
}

// ---------- verificação ----------
function verificar() {
  let erradas = 0, vazias = 0;
  document.querySelectorAll('#grade .cel.letra').forEach(d => {
    const r = +d.dataset.r, c = +d.dataset.c, k = r + ',' + c;
    d.classList.remove('errada');
    if (!est.letras[k]) { vazias++; return; }
    if (est.letras[k] !== est.pag.g[r][c].ch) { d.classList.add('errada'); erradas++; }
  });
  modal('Conferência', erradas === 0 && vazias === 0
    ? '<p>Tudo certo. Página completa.</p>'
    : `<p>${erradas} letra(s) errada(s), marcadas em vermelho, e ${vazias} casa(s) em branco.</p>`);
}
function revelar() {
  if (!est.foco) return;
  const { r, c } = est.foco, k = r + ',' + c;
  est.letras[k] = est.pag.g[r][c].ch; est.dados[k] = 1;
  const d = document.querySelector(`#grade .cel[data-r="${r}"][data-c="${c}"]`);
  if (d) { d.textContent = est.letras[k]; d.classList.add('dado'); d.classList.remove('errada'); }
  salvar(); conferirFim();
}
function conferirFim() {
  for (let r = 0; r < est.pag.h; r++) for (let c = 0; c < est.pag.w; c++) {
    const cel = est.pag.g[r][c];
    if (cel.t === 'L' && est.letras[r + ',' + c] !== cel.ch) return false;
  }
  est.feito = true; salvar();
  const biblicas = est.pag.vagas.filter(v => v.pal.t === 1).map(v => v.pal.e);
  modal('Página concluída', `<p>Tempo: ${formatar(tempoTotal())}.</p>
    <p>Palavras bíblicas desta página:</p><ul><li>${biblicas.join('</li><li>')}</li></ul>`);
  return true;
}

// ---------- tempo e persistência ----------
const tempoTotal = () => est.decorrido + Math.floor((Date.now() - est.inicio) / 1000);
const formatar = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function salvar() {
  if (est.n == null) return;
  cofre.gravar(chave(est.nv, est.n), { letras: est.letras, dados: est.dados, tempo: tempoTotal(), feito: est.feito });
}
setInterval(() => {
  if (!est || document.getElementById('telaJogo').classList.contains('oculto')) return;
  document.getElementById('relogio').textContent = formatar(tempoTotal());
}, 1000);

// ---------- telas ----------
let nivelSel = 1;
function pintarNiveis() {
  const alvo = document.getElementById('listaNiveis');
  alvo.innerHTML = '';
  NIVEIS.forEach(n => {
    const b = document.createElement('button');
    b.className = 'nivel'; b.setAttribute('aria-pressed', n.id === nivelSel);
    const exemplo = PAGINAS.find(p => p.nv === n.id) || { w: 0, h: 0, vagas: [] };
    b.innerHTML = `<b>${n.nome}</b><span>${n.desc}</span>` +
      `<span>${exemplo.w} × ${exemplo.h} casas · ${exemplo.vagas.length} palavras</span>`;
    b.onclick = () => { nivelSel = n.id; pintarNiveis(); pintarPaginas(); };
    alvo.appendChild(b);
  });
}
function pintarPaginas() {
  const alvo = document.getElementById('listaPaginas');
  alvo.innerHTML = '';
  for (let i = 1; i <= PAGINAS_POR_NIVEL; i++) {
    const s = cofre.ler(chave(nivelSel, i));
    const b = document.createElement('button');
    b.className = 'pag' + (s && s.feito ? ' feita' : '');
    b.innerHTML = `<b>${i}</b><small>${s ? (s.feito ? 'concluída' : 'em andamento') : 'nova'}</small>`;
    b.onclick = () => iniciar(nivelSel, i);
    alvo.appendChild(b);
  }
}
function voltar() {
  if (est) salvar();
  est = null;
  document.getElementById('telaJogo').classList.add('oculto');
  document.getElementById('telaInicio').classList.remove('oculto');
  pintarPaginas();
}
function modal(titulo, html) {
  document.getElementById('tituloModal').textContent = titulo;
  document.getElementById('corpoModal').innerHTML = html;
  document.getElementById('veu').classList.add('aberto');
}

// ---------- teclado próprio ----------
function montarTeclado() {
  const linhas = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  const alvo = document.getElementById('teclado');
  linhas.forEach((linha, i) => {
    const d = document.createElement('div'); d.className = 'linhaT';
    if (i === 2) { const b = document.createElement('button'); b.className = 'tecla larga'; b.textContent = 'apagar'; b.onclick = apagar; d.appendChild(b); }
    linha.split('').forEach(l => {
      const b = document.createElement('button'); b.className = 'tecla'; b.textContent = l;
      b.onclick = () => escrever(l); d.appendChild(b);
    });
    if (i === 2) { const b = document.createElement('button'); b.className = 'tecla larga'; b.textContent = 'próxima'; b.onclick = () => irVaga(1); d.appendChild(b); }
    alvo.appendChild(d);
  });
}

document.addEventListener('keydown', e => {
  if (!est || document.getElementById('telaJogo').classList.contains('oculto')) return;
  if (e.key === 'Backspace') { e.preventDefault(); apagar(); }
  else if (e.key === 'Tab') { e.preventDefault(); irVaga(e.shiftKey ? -1 : 1); }
  else if (/^[a-zA-ZçÇ]$/.test(e.key)) { escrever(e.key.toUpperCase().replace('Ç', 'C')); }
  else if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    let r = est.foco.r + d[0], c = est.foco.c + d[1];
    while (r >= 0 && c >= 0 && r < est.pag.h && c < est.pag.w) {
      if (est.pag.g[r][c].t === 'L') { est.dir = d[0] ? 'V' : 'H'; focar(r, c); break; }
      r += d[0]; c += d[1];
    }
  }
});

document.getElementById('btVoltar').onclick = voltar;
document.getElementById('btVerificar').onclick = verificar;
document.getElementById('btRevelar').onclick = revelar;
document.getElementById('btImprimir').onclick = () => window.print();
document.getElementById('btReiniciar').onclick = () => {
  est.letras = {}; est.dados = {}; est.decorrido = 0; est.inicio = Date.now(); est.feito = false;
  salvar(); desenhar(); primeiraVaga();
};
document.getElementById('btProxima').onclick = () => irVaga(1);
document.getElementById('btAnterior').onclick = () => irVaga(-1);
document.getElementById('btFecharModal').onclick = () => document.getElementById('veu').classList.remove('aberto');
document.getElementById('btLimpar').onclick = () => { cofre.apagar('cruzada.v1.'); pintarPaginas(); };
montarTeclado();
pintarNiveis();
pintarPaginas();
</script>
